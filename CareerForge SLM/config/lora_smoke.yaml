model: "mlx-community/Qwen3-4B-Instruct-2507-4bit"
train: true
fine_tune_type: lora
optimizer: adamw
data: "data/processed"
seed: 42

# M4 Pro / 24 GB conservative starting values.
num_layers: 16
batch_size: 1
grad_accumulation_steps: 8
iters: 40
max_seq_length: 4096
grad_checkpoint: true

learning_rate: 1e-5
steps_per_report: 5
steps_per_eval: 10
val_batches: -1
save_every: 20
adapter_path: "adapters/careerforge-qwen3-4b"

# Train on the expected JSON response, not the resume/JD prompt.
mask_prompt: true

lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 16
  scale: 32.0
  dropout: 0.05
